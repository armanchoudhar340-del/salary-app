{% extends "base.html" %}
{% block title %}Add Employee{% endblock %}
{% block content %}
<div class="form-page">
  <div class="form-card">
    <a href="{{ url_for('dashboard') }}" class="back-link">← Go Back</a>
    <h1 class="form-card-title">👤 Add New Employee</h1>

    {% if error %}
      <div class="alert alert-error">⚠️ {{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('add_employee') }}">
      <div class="form-group">
        <label class="form-label" for="name">Employee Name <span class="req">*</span></label>
        <input
          id="name"
          name="name"
          type="text"
          class="form-input"
          placeholder="e.g. Ramesh Kumar"
          maxlength="100"
          autofocus
          required
        >
      </div>
      <div class="form-group">
        <label class="form-label" for="monthly_salary">Monthly Salary (₹) <span class="req">*</span></label>
        <input
          id="monthly_salary"
          name="monthly_salary"
          type="number"
          class="form-input"
          placeholder="e.g. 15000"
          min="1"
          step="1"
          required
        >
      </div>
      <div class="form-group">
        <label class="form-label" for="joining_date">Joining Date <span class="req">*</span></label>
        <input
          id="joining_date"
          name="joining_date"
          type="date"
          class="form-input"
          value="{{ today }}"
          required
        >
      </div>
      <div class="form-actions">
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary btn-lg">✅ Save</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
