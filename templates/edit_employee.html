{% extends "base.html" %}
{% block title %}{{ emp['name'] }} - Edit{% endblock %}
{% block content %}
<div class="form-page">
  <div class="form-card">
    <a href="{{ url_for('employee_profile', emp_id=emp['id']) }}" class="back-link">← Go Back</a>
    <h1 class="form-card-title">✏️ Edit Employee</h1>

    {% if error %}
      <div class="alert alert-error">⚠️ {{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('edit_employee', emp_id=emp['id']) }}">
      <div class="form-group">
        <label class="form-label" for="name">Employee Name <span class="req">*</span></label>
        <input
          id="name"
          name="name"
          type="text"
          class="form-input"
          value="{{ emp['name'] }}"
          maxlength="100"
          autofocus
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="category">Category <span class="req">*</span></label>
        <select id="category" name="category" class="form-input form-select">
          {% for cat in categories %}
            <option value="{{ cat.id }}" {% if cat.id == current_category %}selected{% endif %}>
              {{ cat.icon }} {{ cat.name }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="monthly_salary">Monthly Salary (₹) <span class="req">*</span></label>
        <input
          id="monthly_salary"
          name="monthly_salary"
          type="number"
          class="form-input"
          value="{{ emp['monthly_salary']|int }}"
          min="1"
          step="1"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="joining_date">Joining Date <span class="req">*</span></label>
        <input
          id="joining_date"
          name="joining_date"
          type="date"
          class="form-input"
          value="{{ current_joining }}"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="months_override">Months Override <span class="optional-tag">(Optional)</span></label>
        <input
          id="months_override"
          name="months_override"
          type="number"
          class="form-input"
          placeholder="Auto-calculated if empty"
          value="{{ current_months }}"
          min="0"
          step="1"
        >
        <p class="form-hint">Leave empty for auto-calculation from joining date.</p>
      </div>

      <div class="form-actions">
        <a href="{{ url_for('employee_profile', emp_id=emp['id']) }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary btn-lg">✅ Update</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
